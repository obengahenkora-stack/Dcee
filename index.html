<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab sign in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login">
    <section class="hero">
      <span class="brand"><span class="mark"></span><span id="brand">Lab</span></span>
      <h1>Use lab software from your own laptop</h1>
      <p>Sign in, book a slot, and report faults in one place.</p>
      <div class="seats" id="seats" aria-hidden="true"></div>
      <p>Each square is a licence seat. A booking holds one for you.</p>
    </section>

    <section class="auth">
      <div class="auth-box">
        <div class="tabs" role="tablist">
          <button type="button" id="tab-in" class="on" role="tab">Sign in</button>
          <button type="button" id="tab-up" role="tab">Create account</button>
        </div>

        <form id="login">
          <label for="li-email">Email</label>
          <input id="li-email" type="email" autocomplete="email" required>
          <label for="li-pass">Password</label>
          <input id="li-pass" type="password" autocomplete="current-password" required>
          <button type="submit">Sign in</button>
          <p class="msg" id="login-msg"></p>
        </form>

        <form id="signup" hidden>
          <label for="su-name">Full name</label>
          <input id="su-name" autocomplete="name" required>
          <label for="su-sid">Student ID</label>
          <input id="su-sid" required>
          <label for="su-email">Email</label>
          <input id="su-email" type="email" autocomplete="email" required>
          <label for="su-pass">Password (at least 8 characters)</label>
          <input id="su-pass" type="password" minlength="8" autocomplete="new-password" required>
          <label><input id="su-ok" type="checkbox" required>I will use the lab software only for coursework and follow the lab rules.</label>
          <button type="submit">Create account</button>
          <p class="msg" id="signup-msg"></p>
        </form>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById("brand").textContent = CFG.LAB_NAME;

    // Licence seats: a fixed pattern of lit squares that light up one after another.
    const lit = new Set([0, 1, 2, 3, 5, 6, 11, 12, 13, 14, 17, 22, 23, 24, 28, 31, 32, 33, 37, 38]);
    const seats = document.getElementById("seats");
    for (let i = 0; i < 40; i++) {
      const s = document.createElement("span");
      s.className = "seat" + (lit.has(i) ? " on" : "");
      s.style.setProperty("--d", (i * 45) + "ms");
      seats.append(s);
    }

    // Switch between sign in and create account.
    function pick(signup) {
      document.getElementById("login").hidden = signup;
      document.getElementById("signup").hidden = !signup;
      document.getElementById("tab-in").classList.toggle("on", !signup);
      document.getElementById("tab-up").classList.toggle("on", signup);
    }
    document.getElementById("tab-in").addEventListener("click", () => pick(false));
    document.getElementById("tab-up").addEventListener("click", () => pick(true));

    sb.auth.getSession().then(({ data }) => { if (data.session) location.href = "booking.html"; });

    document.getElementById("login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById("li-email").value.trim(),
        password: document.getElementById("li-pass").value,
      });
      if (error) say("login-msg", error.message, false);
      else location.href = "booking.html";
    });

    document.getElementById("signup").addEventListener("submit", async (e) => {
      e.preventDefault();
      const { error } = await sb.auth.signUp({
        email: document.getElementById("su-email").value.trim(),
        password: document.getElementById("su-pass").value,
        options: { data: {
          full_name: document.getElementById("su-name").value.trim(),
          student_id: document.getElementById("su-sid").value.trim(),
        } },
      });
      if (error) say("signup-msg", error.message, false);
      else say("signup-msg", "Account created. Confirm it from the email we sent, then sign in.", true);
    });
  </script>
</body>
</html>
